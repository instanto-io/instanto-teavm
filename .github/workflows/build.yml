name: Verify TeaVM configuration and extensions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify JVM, JavaScript and Wasm GC
      goals: clean verify
      maven-args: -Pteavm-browser-tests,teavm-class-init-fix -Dspotless.skip=true -Dinstanto.teavm.threadLocalChecks=true
    secrets: inherit

  # Manual for now: instanto-poms still publishes instanto-teavm-pom, which every library
  # inherits. Publish from here only once the parent's move (pending-consumers/README.md) is done.
  publish-snapshot:
    if: github.repository == 'instanto-io/instanto-teavm' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [verify]
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish Maven snapshot
      goals: deploy
      maven-args: -DskipTests -Dspotless.skip=true
    secrets: inherit
